name: CI

on:
  push:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - uses: gradle/actions/setup-gradle@v4

      # 컨텍스트 로딩 테스트가 DB 3종에 붙으므로 로컬과 같은 compose로 띄운다
      - name: DB 3종 기동
        run: docker compose up -d --wait

      - name: 빌드·테스트
        run: ./gradlew build

      - name: 실패 시 컨테이너 로그
        if: failure()
        run: docker compose logs --no-color
