plugins {
	id 'java'
	id 'org.springframework.boot' version '3.5.16'
	id 'io.spring.dependency-management' version '1.1.7'
}

group = 'com.jandilog'
version = '0.0.1-SNAPSHOT'

java {
	toolchain {
		languageVersion = JavaLanguageVersion.of(21)
	}
}

repositories {
	mavenCentral()
}

// Boot 3.5.16 관리 버전에 공개 CVE가 있어 같은 라인의 패치 버전으로만 올린다 (새 의존성 없음)
// tomcat 10.1.55 -> 10.1.60: CVE-2026-77756, CVE-2026-65182 등 (Tomcat 보안 공지 10.1.56~10.1.60)
// jackson 2.21.4 -> 2.21.7: CVE-2026-91777, CVE-2026-91776, CVE-2026-68497 등 (GHSA)
// netty 4.1.135 -> 4.1.139: CVE-2026-75595, CVE-2026-59901 등 (GHSA)
// hibernate 6.6.53은 공개 CVE가 없어 올리지 않는다. Boot가 같거나 높은 버전을 관리하게 되면 아래 줄을 지운다
ext['tomcat.version'] = '10.1.60'
ext['jackson-bom.version'] = '2.21.7'
ext['netty.version'] = '4.1.139.Final'

// 기획서 10장 스택 범위만 둔다. AWS SDK(S3)·QueryDSL은 해당 기능 시점에 추가
dependencies {
	implementation 'org.springframework.boot:spring-boot-starter-web'
	implementation 'org.springframework.boot:spring-boot-starter-graphql'
	implementation 'org.springframework.boot:spring-boot-starter-security'
	implementation 'org.springframework.boot:spring-boot-starter-oauth2-client'
	implementation 'org.springframework.boot:spring-boot-starter-oauth2-resource-server'
	implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
	implementation 'org.springframework.boot:spring-boot-starter-data-mongodb'
	implementation 'org.springframework.boot:spring-boot-starter-data-redis'
	implementation 'org.springframework.boot:spring-boot-starter-actuator'
	implementation 'org.flywaydb:flyway-core'
	implementation 'org.flywaydb:flyway-mysql'
	runtimeOnly 'org.mariadb.jdbc:mariadb-java-client'

	// 개발 편의 도구 (사용자 허용): Lombok, DevTools
	compileOnly 'org.projectlombok:lombok'
	annotationProcessor 'org.projectlombok:lombok'
	developmentOnly 'org.springframework.boot:spring-boot-devtools'

	testImplementation 'org.springframework.boot:spring-boot-starter-test'
	testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
	testCompileOnly 'org.projectlombok:lombok'
	testAnnotationProcessor 'org.projectlombok:lombok'
}

// 실행 가능한 jar 하나만 만든다 (Dockerfile에서 app.jar로 복사)
tasks.named('jar') {
	enabled = false
}

tasks.named('bootJar') {
	archiveFileName = 'app.jar'
}

// JVM 기본 시간대를 Asia/Seoul로 고정
tasks.named('bootRun') {
	jvmArgs '-Duser.timezone=Asia/Seoul'
}

tasks.named('test') {
	useJUnitPlatform()
	systemProperty 'user.timezone', 'Asia/Seoul'
}
