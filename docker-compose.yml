# 로컬 개발용 DB 3종 (기능명세서 10장, DB명세서 5-3)
# 운영은 PostgreSQL은 Neon, MongoDB는 Atlas, Redis는 Upstash를 쓴다
name: jandilog

services:
  # 운영 Neon과 같은 PostgreSQL 16
  postgres:
    image: postgres:16
    container_name: jandilog-postgres
    restart: unless-stopped
    # 테스트가 컨텍스트마다 커넥션 풀을 열어 기본 상한(100)을 넘으므로 로컬·CI에서는 넉넉히 둔다
    command: ["postgres", "-c", "max_connections=400"]
    environment:
      POSTGRES_DB: ${DB_NAME:-jandilog}
      POSTGRES_USER: ${DB_USERNAME:-jandilog}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-jandilog}
    ports:
      - "127.0.0.1:${DB_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME:-jandilog} -d ${DB_NAME:-jandilog}"]
      interval: 5s
      timeout: 5s
      retries: 20

  # 추방 차단 키가 1년 유지되므로 AOF로 디스크에 남긴다 (DB명세서 2장)
  redis:
    image: redis:7-alpine
    container_name: jandilog-redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "127.0.0.1:${REDIS_PORT:-6379}:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  mongodb:
    image: mongo:7.0
    container_name: jandilog-mongodb
    restart: unless-stopped
    ports:
      - "127.0.0.1:${MONGO_PORT:-27017}:27017"
    volumes:
      - mongodb-data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 5s
      timeout: 5s
      retries: 20

volumes:
  postgres-data:
  redis-data:
  mongodb-data:
