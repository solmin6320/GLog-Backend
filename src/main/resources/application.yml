spring:
  application:
    name: jandilog
  # 로컬 .env가 있으면 읽는다. 운영은 OS 환경변수 (환경변수가 .env보다 우선)
  config:
    import: optional:file:.env[.properties]
  autoconfigure:
    exclude:
      # 임시 사용자·생성 비밀번호 로그 방지. 인증 구현 시 JwtDecoder 등 자체 빈으로 대체
      - org.springframework.boot.autoconfigure.security.servlet.UserDetailsServiceAutoConfiguration

  # MariaDB (utf8mb4, DB명세서 1-0). 접속 정보는 환경변수, 기본값은 로컬 docker-compose 값
  datasource:
    url: jdbc:mariadb://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:jandilog}?connectionCollation=utf8mb4_general_ci
    username: ${DB_USERNAME:jandilog}
    password: ${DB_PASSWORD:jandilog}

  # 스키마는 Flyway만 관리 (기능명세서 10장). 운영 clean 금지
  flyway:
    enabled: true
    locations: classpath:db/migration
    clean-disabled: true

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: none
    properties:
      hibernate:
        jdbc:
          time_zone: Asia/Seoul

  # MongoDB: 로컬은 컨테이너, 운영은 Atlas URI 전체를 환경변수로
  data:
    mongodb:
      uri: ${MONGODB_URI:mongodb://localhost:27017/jandilog}
    # Redis: 운영(Upstash)은 REDIS_SSL=true
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      ssl:
        enabled: ${REDIS_SSL:false}

  jackson:
    time-zone: Asia/Seoul

# 헬스체크만 노출하고 Redis는 제외 (Upstash 명령 수 절약, 기능명세서 10장)
management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never
  health:
    redis:
      enabled: false
