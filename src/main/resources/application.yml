spring:
  application:
    name: jandilog
  # 로컬 .env가 있으면 읽는다. 운영은 OS 환경변수 (환경변수가 .env보다 우선)
  config:
    import: optional:file:.env[.properties]
  # GitHub OAuth App. 값은 환경변수로만 받는다 (기본값 없음)
  security:
    oauth2:
      client:
        registration:
          github:
            client-id: ${GITHUB_CLIENT_ID}
            client-secret: ${GITHUB_CLIENT_SECRET}
            scope: read:user
            # GitHub OAuth App에 등록한 콜백 주소. 백엔드 공개 주소 기준 한 곳
            redirect-uri: ${BACKEND_BASE_URL:http://localhost:8080}/login/oauth2/code/{registrationId}

  # MariaDB (utf8mb4, DB명세서 1-0). 접속 정보는 환경변수, 기본값은 로컬 docker-compose 값
  datasource:
    url: jdbc:mariadb://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:jandilog}?connectionCollation=utf8mb4_general_ci
    username: ${DB_USERNAME:jandilog}
    password: ${DB_PASSWORD:jandilog}
    # 풀 대기·연결·쿼리 응답 상한(밀리초). DB가 멈춰도 요청이 무한정 쌓이지 않게 한다. 환경변수로 덮어쓴다
    # socketTimeout은 InnoDB 락 대기 기본값(50초)보다 길게 둬서 락 대기 오류는 DB가 먼저 낸다
    hikari:
      connection-timeout: ${DB_POOL_WAIT_TIMEOUT_MS:10000}
      data-source-properties:
        connectTimeout: ${DB_CONNECT_TIMEOUT_MS:10000}
        socketTimeout: ${DB_SOCKET_TIMEOUT_MS:60000}

  # 스키마는 Flyway만 관리 (기능명세서 10장). 운영 clean 금지
  flyway:
    enabled: true
    locations: classpath:db/migration
    clean-disabled: true

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: none
    properties:
      hibernate:
        jdbc:
          time_zone: Asia/Seoul

  # MongoDB: 로컬은 컨테이너, 운영은 Atlas URI 전체를 환경변수로
  data:
    mongodb:
      uri: ${MONGODB_URI:mongodb://localhost:27017/jandilog}
    # Redis: 운영(Upstash)은 REDIS_SSL=true
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      ssl:
        enabled: ${REDIS_SSL:false}
      # 명령 응답·연결 대기 상한. Redis가 멈춰도 요청이 오래 걸려 쌓이지 않게 한다. 환경변수로 덮어쓴다
      timeout: ${REDIS_COMMAND_TIMEOUT:5s}
      connect-timeout: ${REDIS_CONNECT_TIMEOUT:5s}

  jackson:
    time-zone: Asia/Seoul

  # 종료 신호를 받으면 처리 중인 요청을 이 시간까지 기다린다. docker stop 기본 유예(10초)보다 짧게 둔다
  lifecycle:
    timeout-per-shutdown-phase: ${SHUTDOWN_TIMEOUT:8s}

# OAuth 인증 요청을 잇는 동안에만 세션을 쓴다. 그 뒤 세션은 버린다
server:
  servlet:
    session:
      timeout: 10m
      cookie:
        http-only: true
        same-site: lax
        # 기본 true. 로컬에서 브라우저가 http://localhost의 Secure 쿠키를 거부하면 SESSION_COOKIE_SECURE=false
        secure: ${SESSION_COOKIE_SECURE:true}
  # 종료 때 새 요청은 받지 않고 처리 중인 요청을 마친 뒤 내린다
  shutdown: graceful

jandilog:
  auth:
    # 로그인 후 돌아갈 웹 주소. CORS 허용 출처도 이 값을 쓴다
    web-base-url: ${WEB_BASE_URL:http://localhost:5173}
    # 앱 딥링크 (제안 상태). 다른 앱의 코드 가로채기를 줄이려고 고유 스킴(역도메인형)을 기본값으로 쓴다
    app-deep-link: ${APP_DEEP_LINK:com.jandilog.app://auth}
    jwt:
      # HS256 서명 키(43자 이상 무작위, openssl rand -base64 48). 기본값 없음, 환경변수로만 받는다
      secret: ${JWT_SECRET}
      issuer: jandilog
      # 기획서에 만료 시간 규정 없음. 기본 12시간(사용자 결정), 만료되면 재로그인 (E-03)
      expires-minutes: ${JWT_EXPIRES_MINUTES:720}

  admin:
    # 첫 관리자로 지정할 GitHub 숫자 id(쉼표 구분). 기본값 비어 있음 = 아무도 승격되지 않는다.
    # 로그인할 때 목록에 있으면 ACTIVE+ADMIN으로 만든다. 목록에서 빼도 기존 ADMIN은 강등하지 않는다
    github-ids: ${ADMIN_GITHUB_IDS:}

  grass:
    # 잔디 조회용 GitHub 서버 토큰. 기본값 없음, 환경변수로만 받고 로그에 남기지 않는다
    github-api-token: ${GITHUB_API_TOKEN}

  mongo:
    # MongoDB 연결·응답·서버 선택·풀 대기 상한. 환경변수로 덮어쓰고, MONGODB_URI에 같은 옵션이 있으면 URI 값을 쓴다
    connect-timeout: ${MONGO_CONNECT_TIMEOUT:5s}
    socket-timeout: ${MONGO_SOCKET_TIMEOUT:30s}
    server-selection-timeout: ${MONGO_SERVER_SELECTION_TIMEOUT:10s}
    pool-wait-timeout: ${MONGO_POOL_WAIT_TIMEOUT:10s}

# 헬스체크만 노출하고 Redis는 제외 (Upstash 명령 수 절약, 기능명세서 10장)
management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never
  health:
    redis:
      enabled: false
